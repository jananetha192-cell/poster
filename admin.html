<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>జననేత – పోస్టర్ ఆర్కైవ్</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
*{box-sizing:border-box;margin:0}
body{background:#2a1508;color:#ffeedd;font-family:'Noto Sans Telugu',system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:linear-gradient(135deg,#8a3f0b,#c97224);color:#fff;padding:16px;text-align:center}
header h1{font-size:24px}header p{font-size:12px;opacity:.92;margin-top:2px}
main{max-width:520px;margin:0 auto;padding:14px}
.back{display:inline-block;color:#ffc63f;text-decoration:none;font-size:13px;margin:0 0 12px}
.dhead{font-size:15px;font-weight:700;color:#ffc63f;margin:18px 2px 8px;border-bottom:1px solid #5a3a1e;padding-bottom:6px}
.pcard{background:#3d2110;border:1px solid #5a3a1e;border-radius:18px;padding:12px;margin-bottom:14px}
.pcard img{width:100%;height:auto;border-radius:12px;display:block}
.ptitle{font-size:16px;font-weight:700;color:#ffc63f;margin:10px 2px 2px}
.psub{font-size:12.5px;color:#d8b596;margin:0 2px 10px}
.go{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:#f6871f;color:#fff;font:inherit;font-size:17px;font-weight:700;text-align:center;text-decoration:none}
.note{text-align:center;font-size:12px;color:#d8b596;margin-top:8px;line-height:1.6}
</style>
</head>
<body>
<header><h1>జననేత</h1><p>పోస్టర్ ఆర్కైవ్ – అన్ని పోస్టర్లు ఒకే చోట</p></header>
<main>
<a class="back" href="index.html">← ముఖ్య పేజీ</a>
<div id="list"></div>
<div class="note">కొత్త పోస్టర్ జోడించాలంటే posters.js లో ఒక entry చేర్చండి – ఇక్కడా, ముఖ్య పేజీలోనూ అదే చూపిస్తుంది.</div>
</main>
<script src="posters.js?v=202610252054"></script>
<script src="posters-amit.js?v=20261029"></script>
<script>
/* ఆర్కైవ్: తేదీ వారీగా (కొత్తవి ముందు), అదే తేదీలో posters.js క్రమంలో */
function teDate(ds){var p=ds.split('-');var d=new Date(+p[0],+p[1]-1,+p[2],12);
 return d.toLocaleDateString('te-IN',{day:'numeric',month:'long',year:'numeric',weekday:'long'})}
var list=document.getElementById('list');
var byDate={};
POSTERS.forEach(function(p,idx){(byDate[p.date]=byDate[p.date]||[]).push(idx)});
var dates=Object.keys(byDate).sort().reverse();
var n=0;
dates.forEach(function(ds){
 var h=document.createElement('div');h.className='dhead';h.textContent=teDate(ds);list.appendChild(h);
 byDate[ds].forEach(function(idx){var p=POSTERS[idx];n++;
  var d=document.createElement('div');d.className='pcard';
  d.innerHTML='<img src="'+p.img+'" alt="'+p.title+'"'+(n>1?' loading="lazy"':'')+'>'+
   '<div class="ptitle">'+p.title+'</div><div class="psub">'+p.sub+'</div>'+
   '<a class="go" href="'+p.href+'">పోస్టర్ చేసుకోండి</a>';
  list.appendChild(d)});
});
</script>
</body>
</html>
