<script>
/* ఆర్కైవ్: తేదీ వారీగా (కొత్తవి ముందు), అదే తేదీలో posters.js క్రమంలో */
function teDate(ds){var p=ds.split('-');var d=new Date(+p[0],+p[1]-1,+p[2],12);
 return d.toLocaleDateString('te-IN',{day:'numeric',month:'long',year:'numeric',weekday:'long'})}
function renderList(arr){
 var list=document.getElementById('list');list.innerHTML='';
 var byDate={};
 arr.forEach(function(p,idx){(byDate[p.date]=byDate[p.date]||[]).push(idx)});
 var dates=Object.keys(byDate).sort().reverse();
 var n=0;
 dates.forEach(function(ds){
  var h=document.createElement('div');h.className='dhead';h.textContent=teDate(ds);list.appendChild(h);
  byDate[ds].forEach(function(idx){var p=arr[idx];n++;
   var d=document.createElement('div');d.className='pcard';
   d.innerHTML='<img src="'+p.img+'" alt="'+p.title+'"'+(n>1?' loading="lazy"':'')+'>'+
    '<div class="ptitle">'+p.title+'</div><div class="psub">'+p.sub+'</div>'+
    '<a class="go" href="'+p.href+'">పోస్టర్ చేసుకోండి</a>';
   list.appendChild(d)});
 });
}
renderList(POSTERS);
/* అడ్మిన్ పేజీలో చేర్చిన (Firebase) పోస్టర్లు కూడా అదే జాబితాలో - చదవడం మాత్రమే */
JNFS.registry(false).then(function(items){
 if(!items||!items.length)return;
 if(window.JNParty)items=items.filter(function(t){return JNParty.matchTemplate(t)});
 var seen={};POSTERS.forEach(function(p){var m=/template=([A-Za-z0-9-]+)/.exec(p.href||'');if(m)seen[m[1]]=1});
 items=items.filter(function(t){return t.date&&!seen[t.__id]});
 if(!items.length)return;
 var extra=items.map(function(t){return {date:t.date,title:t.title,sub:t.sub||'మీ పేరు, మీ ఫోటోతో పోస్టర్',href:'studio.html?template='+t.__id,img:t.thumb}});
 renderList(POSTERS.concat(extra));
}).catch(function(){});
</script>
