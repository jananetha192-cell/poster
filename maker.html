<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>జననేత – మీ పోస్టర్ తయారు చేసుకోండి</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf5ff;--card:#fff;--tx:#1f1233;--mu:#6b5b84;--pr:#7c3aed;--bd:#e4d7f7;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150d24;--card:#211436;--tx:#f3ecff;--mu:#b9a9d4;--pr:#a78bfa;--bd:#3a2a5a}}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Telugu',system-ui,sans-serif}
header{background:linear-gradient(135deg,#6b21a8,#a855f7);color:#fff;padding:18px 16px;text-align:center}
header h1{margin:0;font-size:24px}header p{margin:4px 0 0;font-size:13px;opacity:.9}
main{max-width:1000px;margin:0 auto;padding:14px;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:800px){main{grid-template-columns:380px 1fr;align-items:start}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px}
h2{font-size:15px;margin:14px 0 8px;color:var(--pr)}h2:first-child{margin-top:0}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input[type=text],select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input[type=file]{width:100%;font-size:12px;color:var(--mu)}
.themes{display:flex;gap:8px;flex-wrap:wrap}
.themes button{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.themes button.on{border-color:var(--pr)}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btns button{flex:1;min-width:130px;padding:12px;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:var(--pr)}
.btns button.g{background:#16a34a}
.pv{text-align:center}
canvas{width:100%;max-width:420px;height:auto;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.note{font-size:12px;color:var(--mu);margin-top:8px}
details.sec{margin:6px 0}
details.sec>summary{font-size:15px;font-weight:700;color:var(--pr);cursor:pointer;padding:6px 2px;list-style:none}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:'▸ ';font-size:13px}
details.sec[open]>summary::before{content:'▾ '}
.btns button{min-width:0;padding:12px 8px}
</style>
</head>
<body>
<header><h1>జననేత</h1><p>మీ సొంత పోస్టర్ నిమిషాల్లో తయారు చేసుకోండి</p></header>
<main>
<div class="card">
  <details open class="sec"><summary>1. పోస్టర్ రకం</summary><div>
  <select id="tpl">
    <optgroup label="హిందూ పండుగలు">
      <option value="దసరా మహానవమి|శుభాకాంక్షలు|durga|1" selected>దసరా మహానవమి</option>
      <option value="విజయదశమి|శుభాకాంక్షలు|durga|1">విజయదశమి</option>
      <option value="సద్దుల బతుకమ్మ|శుభాకాంక్షలు|bathu|0">సద్దుల బతుకమ్మ</option>
      <option value="బోనాల|శుభాకాంక్షలు|bonalu|1">బోనాలు</option>
      <option value="వినాయక చవితి|శుభాకాంక్షలు|ganesh|0">వినాయక చవితి</option>
      <option value="దసరా|శుభాకాంక్షలు|diya|1">దసరా</option>
      <option value="దీపావళి|శుభాకాంక్షలు|diya|2">దీపావళి</option>
      <option value="సంక్రాంతి|శుభాకాంక్షలు|kite|0">సంక్రాంతి</option>
      <option value="ఉగాది|శుభాకాంక్షలు|mango|3">ఉగాది</option>
    </optgroup>
    <optgroup label="ఇతర మత పండుగలు">
      <option value="రంజాన్|శుభాకాంక్షలు|moon|3">రంజాన్</option>
      <option value="క్రిస్మస్|శుభాకాంక్షలు|star|1">క్రిస్మస్</option>
    </optgroup>
    <optgroup label="జాతీయ దినోత్సవాలు">
      <option value="గణతంత్ర దినోత్సవ|శుభాకాంక్షలు|flag|3">గణతంత్ర దినోత్సవం</option>
      <option value="స్వాతంత్ర్య దినోత్సవ|శుభాకాంక్షలు|flag|3">స్వాతంత్ర్య దినోత్సవం</option>
      <option value="తెలంగాణ ఆవిర్భావ|దినోత్సవ శుభాకాంక్షలు|flag|4">తెలంగాణ ఆవిర్భావ దినోత్సవం</option>
    </optgroup>
    <optgroup label="ప్రత్యేక రోజులు">
      <option value="నూతన సంవత్సర|శుభాకాంక్షలు|star|4">నూతన సంవత్సరం</option>
      <option value="అంబేద్కర్ జయంతి|ఘన నివాళి|chakra|4">అంబేద్కర్ జయంతి</option>
      <option value="పుట్టినరోజు|శుభాకాంక్షలు|balloon|2">పుట్టినరోజు</option>
    </optgroup>
    <optgroup label="నా సొంతం">
      <option value="custom|">నా సొంత టెక్స్ట్</option>
    </optgroup>
  </select>
  <div id="cust">
    <label>పెద్ద టైటిల్</label><input type="text" id="t1" value="దసరా మహానవమి">
    <label>చిన్న టైటిల్</label><input type="text" id="t2" value="శుభాకాంక్షలు">
    <label>టైటిల్ సైజు</label><input type="range" id="tsize" min="60" max="150" value="110">

  <label>రంగు థీమ్</label>

  <label>సైజు</label>

  </div></details>
  <details open class="sec"><summary>2. మీ వివరాలు</summary><div>

  <label>మీ పేరు</label><input type="text" id="name" value="తాళ్లపెల్లి శ్రీనివాస్ గౌడ్" placeholder="ఉదా: రామారావు">

  <label>పార్టీ లోగో</label><input type="file" id="logo" accept="image/*">

  </div></details>
  <details open class="sec"><summary>3. ఇతర నాయకుల ఫోటోలు (ఐచ్ఛికం)</summary><div>
  <label>పై వరుసలో (గరిష్టంగా 8) – పెట్టకపోతే మోదీ, అమిత్ షా, నడ్డా, బండి సంజయ్, కిషన్ రెడ్డి</label><input type="file" id="top" accept="image/*" multiple>
  <label>మీ ఫోటో పక్కన చిన్న ఫోటో (ఐచ్ఛికం)</label><input type="file" id="bot" accept="image/*">
  <label>పండుగ ఫోటో (ఐచ్ఛికం – ఎడమ చట్రంలో వస్తుంది)</label><input type="file" id="extra" accept="image/*">

  <div id="padj" style="display:none">
    <h2>4. ఫోటో సర్దుబాటు (జూమ్ / జరపండి)</h2>
    <label>ఏ ఫోటో?</label><select id="psel"></select>
    <label>జూమ్</label><input type="range" id="pz" min="100" max="250" value="105">
    <label>⇄ ఎడమ-కుడి</label><input type="range" id="px" min="-150" max="150" value="0">
    <label>⇅ పైన-కింద</label><input type="range" id="py" min="-150" max="150" value="0">
    <div class="btns"><button type="button" id="preset">ఈ ఫోటో రీసెట్</button></div>
  </div>


  </div></details>
  <div class="btns">
    <button id="undo" type="button" aria-label="వెనక్కి">↩️ వెనక్కి</button>
    <button id="redo" type="button" aria-label="ముందుకు">↪️ ముందుకు</button>
    <button id="rst" type="button" style="background:#dc2626">🔄 రీసెట్</button>
    <button id="dl">⬇️ డౌన్‌లోడ్</button>
    <button id="sh" class="g">📤 షేర్</button>
  </div>

</div>

let th=1,imgs={main:null,logo:null,top:[],bot:[],extra:null};let DEFTOP=[],DURGA=null;
function ldImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}let EXPORT=false;
let adj={main:{z:1.05,dx:0,dy:0},top:{},bot:{z:1,dx:0,dy:0},extra:{z:1,dx:0,dy:0}};
let HIST=[],HI=-1,SUPPRESS=false;
function snap(){if(SUPPRESS)return;const st={tpl:$('tpl').value,t1:$('t1').value,t2:$('t2').value,tsize:$('tsize').value,tcol:$('tcol').value,tout:$('tout').checked,th,sz:$('sz').value,name:$('name').value,role:$('role').value,adj:JSON.parse(JSON.stringify(adj))};
  const s=JSON.stringify(st);if(HIST[HI]&&JSON.stringify(HIST[HI])==s)return;
  HIST=HIST.slice(0,HI+1);HIST.push(st);if(HIST.length>60)HIST.shift();HI=HIST.length-1;urMark()}
function applyState(st){SUPPRESS=true;$('tpl').value=st.tpl;$('t1').value=st.t1;$('t2').value=st.t2;$('tsize').value=st.tsize;$('tcol').value=st.tcol;$('tout').checked=st.tout;th=st.th;$('sz').value=st.sz;$('name').value=st.name;$('role').value=st.role;adj=JSON.parse(JSON.stringify(st.adj));
  const p=$('sz').value.split('x').map(Number);W=p[0];H=p[1];mark();SUPPRESS=false;draw()}
function urMark(){$('undo').disabled=HI<=0;$('redo').disabled=HI>=HIST.length-1}
function changed(){draw();snap()}
$('undo').onclick=()=>{if(HI>0){HI--;applyState(HIST[HI]);urMark()}};
$('redo').onclick=()=>{if(HI<HIST.length-1){HI++;applyState(HIST[HI]);urMark()}};
$('rst').onclick=()=>{if(!confirm('అన్నీ రీసెట్ చేయాలా?'))return;

  ['main','logo','top','bot','extra'].forEach(id=>$(id).value='');rebuildPsel();mark();SUPPRESS=false;draw();snap()};
var CONES=[null,null,null];['cone_alt1','cone_main','cone_alt2'].forEach(function(n,i){var im=new Image();im.onload=function(){draw()};im.src='assets/img/'+n+'.png';CONES[i]=im});
THEMES.forEach((t,i)=>{const b=document.createElement('button');b.style.background=`linear-gradient(135deg,${t[0]},${t[2]})`;b.onclick=()=>{th=i;mark();changed()};$('themes').appendChild(b)});

mark();
function load(f){return new Promise(r=>{const fr=new FileReader();fr.onerror=()=>r(null);fr.onload=()=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=fr.result};fr.readAsDataURL(f)})}
$('main').onchange=async e=>{imgs.main=e.target.files[0]?await load(e.target.files[0]):null;adj.main={z:1.05,dx:0,dy:0};rebuildPsel();changed()};
$('logo').onchange=async e=>{imgs.logo=e.target.files[0]?await load(e.target.files[0]):null;draw()};

$('top').onchange=async e=>{imgs.top=(await Promise.all([...e.target.files].slice(0,8).map(load))).filter(Boolean);adj.top={};rebuildPsel();changed()};
$('bot').onchange=async e=>{imgs.bot=e.target.files[0]?[await load(e.target.files[0])].filter(Boolean):[];adj.bot={z:1,dx:0,dy:0};rebuildPsel();changed()};
$('extra').onchange=async e=>{imgs.extra=e.target.files[0]?await load(e.target.files[0]):null;adj.extra={z:1,dx:0,dy:0};rebuildPsel();changed()};
$('sz').onchange=()=>{const p=$('sz').value.split('x').map(Number);W=p[0];H=p[1];changed()};
['tpl','t1','t2','tsize','tcol','name','role'].forEach(id=>$(id).oninput=()=>{if(id=='tpl'){const p=$('tpl').value.split('|');if(p[3]!==undefined){th=+p[3];mark()}if(!p[0].startsWith('custom')){$('t1').value=p[0];$('t2').value=p[1]||''}}changed()});
$('tout').onchange=()=>changed();

function adjFor(k){if(k.startsWith('top')){const i=+k.slice(3);if(!adj.top[i])adj.top[i]={z:1,dx:0,dy:0};return adj.top[i]}return adj[k]}
function rebuildPsel(){const s=$('psel'),prev=s.value;s.innerHTML='';
  const opts=[];if(imgs.main)opts.push(['main','మీ ఫోటో']);
  imgs.top.forEach((im,i)=>opts.push(['top'+i,'నాయకుడు '+(i+1)]));
  if(imgs.bot[0])opts.push(['bot','ప్లేట్ పక్కన ఫోటో']);
  if(imgs.extra)opts.push(['extra','అదనపు ఫోటో']);
  opts.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;s.appendChild(o)});
  if(opts.some(([v])=>v==prev))s.value=prev;
  $('padj').style.display=opts.length?'block':'none';loadPsel()}
function loadPsel(){const s=$('psel');if(!s.value)return;const a=adjFor(s.value);$('pz').value=Math.round(a.z*100);$('px').value=a.dx;$('py').value=a.dy}
$('psel').onchange=loadPsel;
['pz','px','py'].forEach(id=>$(id).oninput=()=>{const s=$('psel');if(!s.value)return;const a=adjFor(s.value);a.z=(+$('pz').value)/100;a.dx=+$('px').value;a.dy=+$('py').value;changed()});
$('preset').onclick=()=>{const s=$('psel');if(!s.value)return;const a=adjFor(s.value);a.z=s=='main'?1.05:1;a.dx=0;a.dy=0;loadPsel();changed()};

function cover(img,dx,dy,dw,dh,ad){ad=ad||{z:1,dx:0,dy:0};const s=Math.max(dw/img.width,dh/img.height)*ad.z,w=img.width*s,h=img.height*s;x.drawImage(img,dx+(dw-w)/2+S(ad.dx),dy+(dh-h)/4+S(ad.dy),w,h)}
function circ(img,cx,cy,r,ring,ad){if(!img&&EXPORT)return;x.save();x.beginPath();x.arc(cx,cy,r,0,7);x.fillStyle='rgba(255,215,90,.85)';x.fill();x.beginPath();x.arc(cx,cy,r-5,0,7);x.clip();if(img)cover(img,cx-r,cy-r,2*r,2*r,ad);else{x.fillStyle='#fde68a';x.fillRect(cx-r,cy-r,2*r,2*r);x.fillStyle='#b45309';x.beginPath();x.arc(cx,cy-r*.2,r*.32,0,7);x.fill();x.beginPath();x.ellipse(cx,cy+r*.85,r*.65,r*.5,0,0,7);x.fill()}x.restore()}
function ctext(t,cx,y,size,color,w=W-40){x.font=`800 ${size}px ${FONT}`;x.textAlign='center';x.lineWidth=Math.max(3,size/10);x.strokeStyle='rgba(0,0,0,.55)';if(!$('tout')||$('tout').checked)x.strokeText(t,cx,y,w);x.fillStyle=color;x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=S(8);x.shadowOffsetY=Y(3);x.fillText(t,cx,y,w);x.shadowBlur=0;x.shadowOffsetY=0}

function decor(k){
 const C=['#facc15','#ec4899','#fff','#a855f7','#fb923c'];
 const el=(px,py,rx,ry,c)=>{x.fillStyle=c;x.beginPath();x.ellipse(X(px),Y(py),S(rx),S(ry),0,0,7);x.fill()};
 const diya=(px,py,s)=>{el(px,py,s,s*.35,'#b45309');el(px,py-s*.1,s*.8,s*.2,'#f59e0b');x.fillStyle='#fde047';x.shadowColor='#fbbf24';x.shadowBlur=S(20);x.beginPath();x.moveTo(X(px),Y(py-s*1.3));x.quadraticCurveTo(X(px+s*.4),Y(py-s*.5),X(px),Y(py-s*.3));x.quadraticCurveTo(X(px-s*.4),Y(py-s*.5),X(px),Y(py-s*1.3));x.fill();x.shadowBlur=0};
 const star=(px,py,r,c)=>{px=X(px);py=Y(py);r=S(r);x.fillStyle=c;x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r;x.lineTo(px+q*Math.cos(a),py+q*Math.sin(a))}x.closePath();x.fill()};
 const lotus=(px,py,s)=>{for(let i=-2;i<=2;i++){x.save();x.translate(X(px),Y(py));x.rotate(i*.4);el(0,-s*.6,s*.25,s*.6,i%2?'#f9a8d4':'#ec4899');x.restore()}};
 const wheel=(px,py,r,c)=>{px=X(px);py=Y(py);r=S(r);x.strokeStyle=c;x.lineWidth=Math.max(2,r/10);x.beginPath();x.arc(px,py,r,0,7);x.stroke();x.lineWidth=Math.max(1,r/25);for(let i=0;i<24;i++){const a=i*Math.PI/12;x.beginPath();x.moveTo(px,py);x.lineTo(px+r*Math.cos(a),py+r*Math.sin(a));x.stroke()}};
 if(k=='bathu'){[[95,140,CONES[0]],[225,190,CONES[1]],[315,140,CONES[2]]].forEach(function(sp){var cx=sp[0],h=sp[1],im=sp[2];if(im&&im.complete&&im.naturalWidth){var h2=S(h),w=h2*im.naturalWidth/im.naturalHeight;x.drawImage(im,X(cx)-w/2,Y(1100)-h2,w,h2)}})}
 else if(k=='bonalu'){[[170,990],[430,960],[690,990]].forEach(([px,py],i)=>{const s=i==1?120:90;el(px,py,s*.8,s*.7,'#c2410c');el(px,py-s*.7,s*.45,s*.2,'#ea580c');el(px,py-s*.9,s*.55,s*.1,'#fbbf24');el(px-s*.4,py-s*.95,s*.25,s*.08,'#16a34a');el(px+s*.4,py-s*.95,s*.25,s*.08,'#16a34a');diya(px,py-s*1.0,s*.3);for(let j=0;j<5;j++)el(px-s*.5+j*s*.25,py-s*.15,6,6,'#fde047')})}
 else if(k=='ganesh'){lotus(430,1000,140);diya(200,1000,55);diya(660,1000,55);star(430,880,18,'#fde047')}
 else if(k=='diya'){[[120,1010,40],[250,990,55],[430,975,80],[610,990,55],[740,1010,40]].forEach(([px,py,s])=>diya(px,py,s));for(let i=0;i<14;i++)star(40+i*58,800+(i%3)*30,6+(i%2)*4,'rgba(253,224,71,.8)')}
 else if(k=='kite'){[[140,900,-.3,'#facc15'],[330,960,.2,'#ec4899'],[520,900,-.2,'#22d3ee'],[700,960,.3,'#a3e635']].forEach(([px,py,r,c])=>{x.save();x.translate(X(px),Y(py));x.scale(SU,SU);x.rotate(r);x.fillStyle=c;x.beginPath();x.moveTo(0,-70);x.lineTo(45,0);x.lineTo(0,90);x.lineTo(-45,0);x.closePath();x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(0,-70);x.lineTo(0,90);x.moveTo(-45,0);x.lineTo(45,0);x.stroke();x.beginPath();x.moveTo(0,90);x.quadraticCurveTo(25,140,0,170);x.quadraticCurveTo(-25,200,0,230);x.stroke();x.restore()})}
 else if(k=='mango'){for(let i=0;i<14;i++){x.save();x.translate(X(40+i*58),Y(880+Math.sin(i)*14));x.rotate(Math.PI/2+(i%2?.3:-.3));el(0,0,12,34,'#22c55e');x.restore()}el(430,1010,60,50,'#b45309');el(430,955,36,16,'#f59e0b');el(430,925,30,28,'#92400e');for(let i=-2;i<=2;i++){x.save();x.translate(X(430),Y(925));x.rotate(i*.45);el(0,-40,10,32,'#16a34a');x.restore()}}
 else if(k=='moon'){const o=document.createElement('canvas');o.width=o.height=240;const g=o.getContext('2d');g.fillStyle='#fde047';g.beginPath();g.arc(120,120,100,0,7);g.fill();g.globalCompositeOperation='destination-out';g.beginPath();g.arc(160,100,85,0,7);g.fill();x.shadowColor='#fde047';x.shadowBlur=S(30);x.drawImage(o,X(310),Y(830),S(240),S(240));x.shadowBlur=0;star(560,900,22,'#fde047');star(240,960,14,'#fde047');star(640,1000,10,'#fde047')}
 else if(k=='star'){star(430,950,120,'#fde047');[[150,900,30],[700,880,34],[260,1020,18],[620,1030,22],[90,1000,12],[770,1000,14]].forEach(([a,b,r])=>star(a,b,r,'rgba(253,224,71,.85)'))}
 else if(k=='flag'){x.fillStyle='#78350f';x.fillRect(X(110),Y(860),S(10),Y(220));[['#ff9933',0],['#fff',44],['#138808',88]].forEach(([c,o])=>{x.fillStyle=c;x.fillRect(X(120),Y(880+o),S(600),S(44))});wheel(420,946,19,'#1d4ed8')}
 else if(k=='chakra'){x.fillStyle='rgba(255,255,255,.9)';x.beginPath();x.arc(X(430),Y(960),S(125),0,7);x.fill();wheel(430,960,110,'#1d4ed8')}
 else if(k=='balloon'){[[150,960,'#ec4899'],[290,920,'#facc15'],[430,970,'#22d3ee'],[570,920,'#a3e635'],[710,960,'#f97316']].forEach(([px,py,c])=>{x.strokeStyle='#fff';x.lineWidth=Math.max(2,S(2));x.beginPath();x.moveTo(X(px),Y(py+65));x.quadraticCurveTo(X(px+15),Y(py+110),X(px),Y(py+150));x.stroke();el(px,py,50,65,c);el(px-16,py-22,10,16,'rgba(255,255,255,.5)')})}
 else{lotus(170,1000,100);lotus(430,980,140);lotus(690,1000,100)}
}
function rr(px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath()}
function fitOne(t,size,wMax,wt){let q=size;x.font=`${wt} ${q}px ${FONT}`;while(q>S(12)&&x.measureText(t).width>wMax){q-=1;x.font=`${wt} ${q}px ${FONT}`}return q}
function wrapFit(t,wMax,size,wt,maxL,minS){let q=size;for(;;){x.font=`${wt} ${q}px ${FONT}`;const ws=t.split(/\s+/).filter(Boolean),L=[];let c='';ws.forEach(w=>{const u=c?c+' '+w:w;if(!c||x.measureText(u).width<=wMax)c=u;else{L.push(c);c=w}});if(c)L.push(c);if((L.length<=maxL&&L.every(l=>x.measureText(l).width<=wMax))||q<=minS)return{L,q};q-=1}}
function frameDecor(D,fx,fy,fw,fh){x.save();rr(fx,fy,fw,fh,S(26));x.clip();x.fillStyle='rgba(0,0,0,.22)';x.fillRect(fx,fy,fw,fh);const k=Math.min(fw/(SX*760),1)*.9;x.translate(fx+fw/2,fy+fh/2);x.scale(k,k);x.translate(-X(420),-Y(950));decor(D);x.restore()}
function draw(){
  SX=W/840;SY=H/1200;SU=W/840;
  if(cv.width!=W||cv.height!=H){cv.width=W;cv.height=H}
  const t=THEMES[th];
  x.fillStyle=t[1];x.fillRect(0,0,W,H);
  let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,t[0]+'66');g.addColorStop(.5,t[1]+'00');g.addColorStop(1,t[2]+'aa');x.fillStyle=g;x.fillRect(0,0,W,H);
  const GOLD='#f2c14e';
  // top leaders strip (photos only)
  const tp=imgs.top.length?imgs.top:Array(5).fill(null),n=tp.length;
  {const gap=S(Math.min(136,700/n)),r=S(Math.min(54,gap/S(1)/2-6));
   tp.forEach((im,i)=>circ(im,W/2+(i-(n-1)/2)*gap,Y(92),r,0,adj.top[i]))}
  // gold divider
  x.fillStyle=GOLD;x.fillRect(X(70),Y(180),W-X(140),Math.max(2,S(3)));
  // title
  const v=$('tpl').value;let D='lotus';
  if(!v.startsWith('custom')){const p=v.split('|');D=p[2]||'lotus'}
  const a=$('t1').value,b=$('t2').value;
  const ts=(+$('tsize').value||110)/110,tc=$('tcol').value||'#fbe3a5';
  const tw=W-X(80);
  const s1=fitOne(a,S(118)*ts,tw,800);ctext(a,W/2,Y(318),s1,tc,tw);
  const s2=fitOne(b,S(70)*ts,tw,800);ctext(b,W/2,Y(412),s2,'#fff7e0',tw);
  // framed festival photo (left)
  const fx=X(50),fy=Y(470),fw=X(410),fh=Y(540);
  const fimg=imgs.extra||(D=='durga'?DURGA:null);
  if(fimg){x.save();rr(fx,fy,fw,fh,S(26));x.clip();cover(fimg,fx,fy,fw,fh,imgs.extra?adj.extra:null);x.restore()}
  else frameDecor(D,fx,fy,fw,fh);
  x.strokeStyle=GOLD;x.lineWidth=S(5);rr(fx,fy,fw,fh,S(26));x.stroke();
  // full-width navy name bar at the bottom with BJP lotus (layout from Srinivas's 2026-10-19 mock)
  const barH=Y(180),barTop=H-barH;
  x.fillStyle='#1c2060';x.fillRect(0,barTop,W,barH);
  x.fillStyle=GOLD;x.fillRect(0,barTop,W,Math.max(2,S(3)));
  const lg=imgs.logo||DEFLOGO;
  const lcx=X(92),lcy=barTop+barH/2,lr=S(56);
  x.fillStyle='#fff';x.beginPath();x.arc(lcx,lcy,lr,0,7);x.fill();
  x.strokeStyle=GOLD;x.lineWidth=S(3);x.beginPath();x.arc(lcx,lcy,lr,0,7);x.stroke();
  if(lg){const k=Math.min(lr*1.5/lg.width,lr*1.5/lg.height);x.drawImage(lg,lcx-lg.width*k/2,lcy-lg.height*k/2,lg.width*k,lg.height*k)}
  // maker photo (bottom-right, large, overlapping the bar; drawn whole, no crop)
  const mw=X(300),mh=Y(470),mx=W-mw-X(8),my=H-mh;
  if(imgs.main){const ad=adj.main,sc=Math.min(mw/imgs.main.width,mh/imgs.main.height)*ad.z,w2=imgs.main.width*sc,h2=imgs.main.height*sc;x.drawImage(imgs.main,mx+(mw-w2)/2+S(ad.dx),my+mh-h2+S(ad.dy),w2,h2)}
  else if(!EXPORT){x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=S(3);x.setLineDash([S(12),S(9)]);rr(mx+X(24),my+Y(46),mw-X(48),mh-Y(54),S(22));x.stroke();x.setLineDash([]);x.fillStyle='rgba(255,255,255,.8)';x.font=`600 ${S(26)}px ${FONT}`;x.textAlign='center';x.fillText('మీ ఫోటో',mx+mw/2,my+mh/2)}
  // name + role inside the bar, centred between lotus and photo
  const nm=$('name').value,rl=$('role').value,zl=lcx+lr+S(16),zr=mx-S(14),zc=(zl+zr)/2,TW=zr-zl;
  const N=wrapFit(nm,TW,S(44),800,1,S(18)),R=wrapFit(rl,TW,S(24),600,2,S(13));
  const nlh=N.q*1.32,rlh=R.q*1.35,gapY=S(12);
  const tot=N.L.length*nlh+(rl&&nm?gapY:0)+R.L.length*rlh;
  let yy=barTop+(barH-tot)/2;
  x.textAlign='center';
  N.L.forEach(l=>{yy+=nlh;x.font=`800 ${N.q}px ${FONT}`;x.fillStyle='#ffd75e';x.shadowColor='rgba(0,0,0,.4)';x.shadowBlur=S(3);x.fillText(l,zc,yy-nlh*.22,TW);x.shadowBlur=0});
  if(rl&&nm)yy+=gapY;
  R.L.forEach(l=>{yy+=rlh;x.font=`600 ${R.q}px ${FONT}`;x.fillStyle='#ffffff';x.fillText(l,zc,yy-rlh*.22,TW)});
  if(imgs.bot[0])circ(imgs.bot[0],mx-S(28),barTop-S(8),S(46),0,adj.bot);
}
Promise.all([ldImg(DURGA_SRC),...DEFLEAD.map(d=>ldImg('data:image/jpeg;base64,'+d))]).then(a=>{DURGA=a[0];DEFTOP=a.slice(1).filter(Boolean);if(!imgs.top.length){imgs.top=DEFTOP.slice();rebuildPsel()}draw()});
document.fonts.load(`800 40px 'Noto Sans Telugu'`,'అ').then(draw);draw();snap();
function blob(){EXPORT=true;draw();return new Promise(r=>cv.toBlob(b=>{EXPORT=false;draw();r(b)},'image/png'))}

$('sh').onclick=async()=>{const b=await blob(),f=new File([b],'poster.png',{type:'image/png'});
