<style>
:root{--bg:#2a1508;--card:#3d2110;--tx:#ffeedd;--mu:#d8b596;--pr:#f6871f;--bd:#5a3a1e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans Telugu',system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:linear-gradient(135deg,#8a3f0b,#c97224);color:#fff;padding:16px;text-align:center}
header h1{margin:0;font-size:22px}header p{margin:4px 0 0;font-size:12px;opacity:.92}
main{max-width:560px;margin:0 auto;padding:12px;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
h2{font-size:15px;margin:2px 0 8px;color:#ffc63f}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input[type=text]{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:#2a1508;color:var(--tx);font:inherit}
input[type=range]{width:100%;height:36px;accent-color:var(--pr);margin:2px 0 6px}
select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:#2a1508;color:var(--tx);font:inherit}
#ldrGrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.lcell{width:56px;text-align:center;cursor:pointer}
.lcell img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #ffd700}
.lempty{width:56px;height:56px;border-radius:50%;border:2px dashed #ffd700;color:#ffd700;font-size:24px;line-height:52px;text-align:center}
.lcell span{font-size:11px;color:#d8b596;display:block;margin-top:2px}
.psep{border:0;border-top:1px solid var(--bd);margin:12px 0}
canvas{width:100%;height:auto;border-radius:10px;display:block}
.heroRow{display:flex;gap:10px;align-items:center}
.thumb{width:76px;height:100px;background:#2a1508;border:1px solid var(--bd);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none}
.thumb img{max-width:100%;max-height:100%}
.pickBtn{flex:1;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:var(--pr);font-size:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns button{flex:1;min-width:120px;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:var(--pr);font-size:17px}
.btns button.g{background:#16a34a}
.btns button.o{background:#6b7280}
.note{font-size:12px;color:var(--mu);line-height:1.6}
#bgLoad{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:99}
#bgLoad.on{display:flex}
#bgLoad .bgcard{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 22px;text-align:center;font-weight:700}
#bgLoad .bgsub{font-size:12px;color:var(--mu);margin-top:4px;font-weight:400}
#bgLoad .spin{width:26px;height:26px;border:3px solid var(--bd);border-top-color:var(--pr);border-radius:50%;margin:0 auto 8px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(80px);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;max-width:92%;text-align:center;z-index:9}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>

   if(a[p]&&a[p-1]&&a[p+1]&&a[p-w]&&a[p+w]&&a[p-w-1]&&a[p-w+1]&&a[p+w-1]&&a[p+w+1])b[p]=1}

    b[p*3+k]=(a[(p-1)*3+k]+a[p*3+k]+a[(p+1)*3+k]+a[(p-w-1)*3+k]+a[(p-w)*3+k]+a[(p-w+1)*3+k]+a[(p+w-1)*3+k]+a[(p+w)*3+k]+a[(p+w+1)*3+k])/9}}

   if(x<w-1&&dist[p-w+1]+1.5<bd){bd=dist[p-w+1]+1.5;bp=p-w+1}}

 }

   if(x>0&&dist[p+w-1]+1.5<bd){bd=dist[p+w-1]+1.5;bp=p+w-1}
   if(x<w-1&&dist[p+w+1]+1.5<bd){bd=dist[p+w+1]+1.5;bp=p+w+1}}

function paintSlot(s,c){

 var Z=1.18,cx0=sx+side/2,cy0=sy+side*0.40;

  if(side>c.width||side>c.height){side=Math.min(c.width,c.height)}
  if(sx<0)sx=0;if(sy<0)sy=0;
  if(sx+side>c.width)sx=c.width-side;if(sy+side>c.height)sy=c.height-side;
 }
 var r=s.d/2,cx=s.x+r,cy=s.y+r;

 g.shadowColor='rgba(0,0,0,'+(s.grp=='big'?'0.55':'0.45')+')';

 g.beginPath();g.arc(cx,cy,r,0,6.2832);g.closePath();
