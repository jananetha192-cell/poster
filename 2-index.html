<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>జననేత – రోజువారీ పోస్టర్లు</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
*{box-sizing:border-box;margin:0}
body{background:#2a1508;color:#ffeedd;font-family:'Noto Sans Telugu',system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:linear-gradient(135deg,#8a3f0b,#c97224);color:#fff;padding:16px;text-align:center}
header h1{font-size:24px}header p{font-size:12px;opacity:.92;margin-top:2px}
main{max-width:520px;margin:0 auto;padding:14px 0 24px}
#track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#track::-webkit-scrollbar{display:none}
.slide{min-width:100%;scroll-snap-align:center;padding:0 14px}
.pcard{background:#3d2110;border:1px solid #5a3a1e;border-radius:18px;padding:12px;position:relative}
.daybadge{position:absolute;top:22px;left:22px;z-index:2;background:#f6871f;color:#fff;font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pcard img{width:100%;height:auto;border-radius:12px;display:block}
.ptitle{font-size:16px;font-weight:700;color:#ffc63f;margin:10px 2px 2px}
.psub{font-size:12.5px;color:#d8b596;margin:0 2px 10px}
.pdate{font-size:12px;color:#d8b596;margin:8px 2px 0}
.go{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:#f6871f;color:#fff;font:inherit;font-size:17px;font-weight:700;text-align:center;text-decoration:none}
.empty{border:2px dashed #5a3a1e;border-radius:12px;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;color:#d8b596}
.empty .big{font-size:44px}
.empty .msg{font-size:16px;font-weight:700;color:#ffc63f}
.empty .sub{font-size:13px;line-height:1.6}
#dots{display:flex;gap:8px;justify-content:center;margin:14px 0 4px}
#dots i{width:9px;height:9px;border-radius:50%;background:#5a3a1e;transition:.2s}
#dots i.on{background:#f6871f;transform:scale(1.25)}
#count{text-align:center;font-size:12px;color:#d8b596}
.arch{display:block;text-align:center;margin:16px 14px 0;padding:12px;border:1px solid #5a3a1e;border-radius:12px;color:#ffc63f;text-decoration:none;font-size:14px;font-weight:700;background:#3d2110}
.hint{text-align:center;font-size:12px;color:#d8b596;margin-top:12px}
</style>
</head>
<body>
<header><h1>జననేత</h1><p>రోజువారీ పోస్టర్లు – మీ పేరు, మీ ఫోటోతో</p></header>
<main>
<div id="track"></div>
<div id="dots"></div>
<div id="count"></div>
<a class="arch" href="admin.html">అన్ని పోస్టర్లు (ఆర్కైవ్) చూడండి →</a>
<div class="hint">⇦ స్లయిడ్ చేసి నిన్న / ఈ రోజు / రేపు చూడండి ⇨</div>
</main>
<script src="posters.js?v=202610252054"></script>
<script>
/* మూడు స్లయిడ్‌లు: నిన్న / ఈ రోజు / రేపు – తేదీ ఆధారంగా ఆర్కైవ్ (posters.js) నుండి ఆటోమేటిక్ ఎంపిక */
function istDate(off){var d=new Date(Date.now()+off*86400000);
 return d.toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'})}  /* YYYY-MM-DD, Asia/Kolkata */
function teDate(ds){var p=ds.split('-');var d=new Date(+p[0],+p[1]-1,+p[2],12);
 return d.toLocaleDateString('te-IN',{day:'numeric',month:'long',year:'numeric',weekday:'long'})}
function pick(ds){
 var feat=null,first=null;
 for(var i=0;i<POSTERS.length;i++){var p=POSTERS[i];
  if(p.date!==ds)continue;
  if(!first)first=p;
  if(p.feature){feat=p;break}}
 return feat||first}
var DAYS=[{label:'నిన్న',off:-1},{label:'ఈ రోజు',off:0},{label:'రేపు',off:1}];
var tr=document.getElementById('track'),dots=document.getElementById('dots'),cnt=document.getElementById('count');
DAYS.forEach(function(day,i){
 var ds=istDate(day.off),p=pick(ds);
 var d=document.createElement('div');d.className='slide';
 if(p){
  d.innerHTML='<div class="pcard"><div class="daybadge">'+day.label+'</div>'+
   '<img src="'+p.img+'" alt="'+p.title+'"'+(i>0?' loading="lazy"':'')+'>'+
   '<div class="ptitle">'+p.title+'</div><div class="psub">'+p.sub+'</div>'+
   '<a class="go" href="'+p.href+'">పోస్టర్ చేసుకోండి</a>'+
   '<div class="pdate">'+teDate(ds)+'</div></div>';
 }else{
  var msg=day.off>0?'రేపు పోస్టర్ త్వరలో…':(day.off<0?'నిన్నటి పోస్టర్ లేదు':'ఈ రోజు పోస్టర్ త్వరలో…');
  d.innerHTML='<div class="pcard"><div class="daybadge">'+day.label+'</div>'+
   '<div class="empty"><div class="big">🖼️</div><div class="msg">'+msg+'</div>'+
   '<div class="sub">'+teDate(ds)+'<br>పాత పోస్టర్ల కొరకు కింది ఆర్కైవ్ చూడండి</div></div></div>';
 }
 tr.appendChild(d);
 var dot=document.createElement('i');if(i==1)dot.className='on';dots.appendChild(dot);
 dot.onclick=function(){tr.scrollTo({left:i*tr.clientWidth,behavior:'smooth'})};
});
function upd(){var i=Math.round(tr.scrollLeft/tr.clientWidth);i=Math.max(0,Math.min(DAYS.length-1,i));
 [].forEach.call(dots.children,function(d,j){d.className=j==i?'on':''});
 cnt.textContent=(i+1)+' / '+DAYS.length}
tr.addEventListener('scroll',function(){requestAnimationFrame(upd)});
window.addEventListener('load',function(){tr.scrollTo({left:tr.clientWidth});upd()});  /* ఈ రోజు మధ్యలో */
upd();
</script>
</body>
</html>
