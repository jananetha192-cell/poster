<title>జననేత – మహా పాదయాత్ర పోస్టర్ మేకర్</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans Telugu','Segoe UI',sans-serif;background:linear-gradient(135deg,#1f2d4e,#0b1224);min-height:100vh;padding:15px;color:#fff}
h1{text-align:center;color:#FFD874;margin-bottom:16px;font-size:22px;text-shadow:1px 1px 3px #000}
.container{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:380px 1fr;gap:18px}
@media(max-width:900px){.container{grid-template-columns:1fr}}
.card{background:rgba(0,0,0,.4);border-radius:14px;padding:16px;border:1px solid #FFD87444}
h2{color:#FFD874;font-size:16px;margin-bottom:10px;border-bottom:1px solid #FFD87433;padding-bottom:6px}
label{display:block;margin:10px 0 4px;font-size:13px;color:#FFE9B0}
input[type=text]{width:100%;padding:11px;border-radius:8px;border:none;font-size:15px;font-family:inherit}
input[type=range]{width:100%}
.btn{width:100%;margin-top:12px;padding:13px;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;background:linear-gradient(135deg,#2ecc71,#16a085);color:#fff}
#ldrs{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.lc{width:52px;height:52px;border-radius:50%;border:3px solid #efbf59;overflow:hidden;cursor:pointer;background:#50240f}
.lc img{width:100%;height:100%;object-fit:cover;display:block}
.note{font-size:12px;color:#d8deee;line-height:1.6;margin-top:6px}
.preview-area{text-align:center}
canvas{width:100%;max-width:440px;height:auto;border-radius:10px;box-shadow:0 8px 24px #000a}
#wrap{position:relative;width:100%;max-width:440px;margin:0 auto;line-height:0}#wrap canvas{display:block;width:100%}#hit,#hitn,#hitd{position:absolute;display:none;touch-action:none;cursor:move;border:2px dashed rgba(255,216,116,.9);border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,.4);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#st.warn{background:#B71C1C;color:#fff;font-size:15px;font-weight:700;padding:10px 12px;border-radius:8px}
#st{font-size:12px;color:#FFE9B0;margin-top:8px;min-height:18px}
</style>

<h1>మహా పాదయాత్ర పోస్టర్ మేకర్</h1>

 <h2>1. మీ వివరాలు</h2>

 <h2 style="margin-top:16px">2. మీ ఫోటో</h2>
 <input type="file" id="meF" accept="image/*">
 <div class="note">ఫోటో బ్యాక్‌గ్రౌండ్ ఆటోమేటిక్‌గా తొలగిపోతుంది (మొదటిసారి కొంచెం సమయం పడుతుంది).</div>
 <div class="note" style="color:#FFE9B0;font-weight:700">పోస్టర్ మీద ఫోటో, పేరు, పదవి బాక్స్‌లను వేలితో లాగి కదిలించండి. ఫోటోను రెండు వేళ్లతో పెద్దగా / చిన్నగా చేయవచ్చు.</div>

 var u=URL.createObjectURL(file),im=await new Promise(function(r,j){var i=new Image();i.onload=function(){r(i)};i.onerror=j;i.src=u});

var hitEl=document.getElementById('hit'),hitN=document.getElementById('hitn'),hitD=document.getElementById('hitd');
function placeBox(el,B){if(!B){el.style.display='none';return}
 var x0=Math.max(0,B[0]),y0=Math.max(0,B[1]),x1=Math.min(W,B[0]+B[2]),y1=Math.min(H,B[1]+B[3]);
 if(x1<=x0||y1<=y0){el.style.display='none';return}
 if(x1-x0<80){var c=(x0+x1)/2;x0=Math.max(0,c-40);x1=Math.min(W,c+40)}if(y1-y0<60){var d=(y0+y1)/2;y0=Math.max(0,d-30);y1=Math.min(H,d+30)}
 el.style.display='block';el.style.left=(x0/W*100)+'%';el.style.top=(y0/H*100)+'%';el.style.width=((x1-x0)/W*100)+'%';el.style.height=((y1-y0)/H*100)+'%'}

(function(){

 function cl(v,a,b){return Math.max(a,Math.min(b,v))}
 function bind(el,onMove,getS,setS){
  var P={},drag=null,pin=null;
  function k(){return Object.keys(P)}
  function sc(){return W/cv.getBoundingClientRect().width}
  el.addEventListener('pointerdown',function(e){e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(x){}
   P[e.pointerId]=[e.clientX,e.clientY];var ks=k();
   if(ks.length==1){drag=[e.clientX,e.clientY];pin=null}
   else if(ks.length>=2){drag=null;var a=P[ks[0]],b=P[ks[1]];pin={d:Math.hypot(a[0]-b[0],a[1]-b[1]),s:getS()}}});
  el.addEventListener('pointermove',function(e){if(!(e.pointerId in P))return;e.preventDefault();P[e.pointerId]=[e.clientX,e.clientY];var ks=k();
   if(ks.length>=2&&pin){var a=P[ks[0]],b=P[ks[1]],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pin.d>4){setS(pin.s*d/pin.d);draw()}}
   else if(ks.length==1&&drag){var f=sc();onMove((e.clientX-drag[0])*f,(e.clientY-drag[1])*f);drag=[e.clientX,e.clientY];draw()}});
  function up(e){delete P[e.pointerId];var ks=k();pin=null;drag=ks.length==1?P[ks[0]].slice():null}
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
  el.addEventListener('contextmenu',function(e){e.preventDefault()});

 }
