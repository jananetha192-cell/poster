<title>జననేత – రోజువారీ పోస్టర్లు</title>

<style>
*{box-sizing:border-box;margin:0}
body{background:#2a1508;color:#ffeedd;font-family:'Noto Sans Telugu',system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:linear-gradient(135deg,#8a3f0b,#c97224);color:#fff;padding:16px;text-align:center}
header h1{font-size:24px}header p{font-size:12px;opacity:.92;margin-top:2px}
main{max-width:520px;margin:0 auto;padding:14px 0 24px}
#track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#track::-webkit-scrollbar{display:none}
.slide{min-width:100%;scroll-snap-align:center;padding:0 14px}
.pcard{background:#3d2110;border:1px solid #5a3a1e;border-radius:18px;padding:12px;position:relative}
.badge{position:absolute;top:22px;left:22px;z-index:2;background:#f6871f;color:#fff;font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pcard img{width:100%;height:auto;border-radius:12px;display:block}
.ptitle{font-size:16px;font-weight:700;color:#ffc63f;margin:10px 2px 2px}
.psub{font-size:12.5px;color:#d8b596;margin:0 2px 10px}
.go{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:#f6871f;color:#fff;font:inherit;font-size:17px;font-weight:700;text-align:center;text-decoration:none}
#dots{display:flex;gap:8px;justify-content:center;margin:14px 0 4px}
#dots i{width:9px;height:9px;border-radius:50%;background:#5a3a1e;transition:.2s}
#dots i.on{background:#f6871f;transform:scale(1.25)}
#count{text-align:center;font-size:12px;color:#d8b596}
.hint{text-align:center;font-size:12px;color:#d8b596;margin-top:14px}
</style>
</head>
<body>
<header><h1>జననేత</h1><p>రోజువారీ పోస్టర్లు – మీ పేరు, మీ ఫోటోతో</p></header>

</main>
